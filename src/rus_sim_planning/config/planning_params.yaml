# 规划节点参数（rus_sim_planning）
planning_node:
  ros__parameters:
    # ── 数据获取 ──
    point_cloud_topic: "/preprocessed_cloud"   # 点云话题（感知/预处理输出）
    driver_state_topic: "/driver/state"        # 机械臂状态话题（驱动节点发布）
    driver_command_service: "/driver/command"  # 伺服指令转发目标（驱动执行）

    # ── 伺服执行（起终点 / 规划 / 执行通过 /planning/command 外部指令设置）──
    servo_rate_hz: 125.0                       # 伺服指令发布频率 [Hz]（驱动控制循环 1kHz，滤波带宽 ~5Hz，125Hz 平滑且开销小）
    interpolate_points: 10                     # 相邻路径点之间插值点数
    movel_timeout_sec: 10.0                    # execute 前 movel 到轨迹起点的等待超时（秒）

    # ── 规划工作流（/planning/command 指令 + 事件）──
    #   pre_scan_done（外部：医生完成手动扫查）→ planning 取最新点云初始化
    #   → set_start_pose / set_end_pose → plan（plan_done 事件）→ execute（scan_done 事件）
    # 预扫查门：未收到外部 pre_scan_done 指令时 plan 会失败并上报 error 事件
    alpha: 1.0            # 椭圆 Gabriel 条件检查参数
    graph_k: 30           # 建图 k-NN 参数
    normal_k: 30          # 法线估计参数
    projection_k: 30      # 重投影参数
    tol: 1.0e-6           # 长度变化容差
    max_iter: 40          # 最大迭代轮次
    use_smoothing: true   # 是否开启平滑
    lambda: 0.63          # Taubin 平滑参数
    mu: -0.65             # Taubin 平滑参数

    # ── 工具坐标系 ──
    # 探头/工具坐标系变换由驱动统一管理（见 rus_sim_driver config/tool_coords.yaml 与六点标定），
    # planning 直接基于 TCP 位姿（基座下）规划，不再维护探头标定。
