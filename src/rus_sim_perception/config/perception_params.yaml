# 感知节点参数（rus_sim_perception）
perception_node:
  ros__parameters:
    # ── 数据源（采集层，实现在 src/camera/）──
    # realsense  RealSense 直连（librealsense2，不经 realsense2_camera）
    #            设备独占：同一台相机不能与本包装节点同时打开
    # ros_topic  PointCloud2 话题（realsense2_camera / 仿真 / rosbag）
    # replay     离线 PCD 循环回放（无设备联调，走与相机完全相同的处理链）
    # auto       启动探测：有 RealSense 设备 → realsense，否则 → ros_topic
    source: "realsense"

    # ── 话题参数 ──
    input_cloud_topic: "/camera/camera/depth/color/points"   # ros_topic 源的输入点云话题（其它源不使用）
    output_cloud_topic: "/preprocessed_cloud"                # 地图快照（rolling/accumulate）或当前帧（none）→ planning 规划输入，base_link
    frame_topic: "/perception/frame"                         # 当前处理帧（高频，RViz 实时可视化）
    sensor_cloud_topic: "/sensor/pointcloud"                 # 压缩点云帧（SensorFrame → 前端 /sensor 通路；bridge 转发待接）
    driver_state_topic: "/driver/state"                      # 机械臂状态话题（位姿时间对齐用）

    # ── RealSense 直连参数（source=realsense）──
    rs_serial: ""             # 设备序列号（空 = 第一台可用设备；多台相机时必填）
    rs_width: 640             # 深度/彩色流宽高与帧率；型号不支持该组合时自动退回设备默认配置
    rs_height: 480
    rs_fps: 15
    rs_align_to: "color"      # none | color | depth —— 决定点云所在光学系，须与 camera_to_flange 标定一致
                              #   color：深度对齐到彩色（可取 RGB），点云属 camera_color_optical_frame
                              #          —— 与旧 /camera/camera/depth/color/points 同系，原标定直接沿用
                              #   none ：最快，点云属 camera_depth_optical_frame，且无法取 RGB（自动降级白点）
    rs_color_mode: "rgb"      # rgb（需 rs_align_to=color）| white（白点，可省掉彩色流）
    rs_point_stride: 1        # 像素抽稀步长：1=全分辨率(640×480≈30.7万点，与 viewer 一致)，2=≈5.6万点(÷4)
                              #   ★ 实测处理帧率（本机 640×480@15）：stride=1 → 3.8Hz（单帧后处理 ~185ms）；
                              #     stride=2 → 9.5Hz（~65ms）。单帧后处理耗时正比于点数，
                              #     故这是最有效的提速手段（观感代价比关体素小）。
                              #   观感优先用 1（与 viewer 点密度逐像素可比）；想要 ~10Hz 流畅前端就改 2
                              #   （WS 带宽同时从 1.6MB/帧 降到 0.45MB）。注意：提高 rs_fps 没用 ——
                              #   采集 15fps 时处理都只能跟上 3.8~9.5Hz，提高帧率只会增加帧槽覆盖丢弃。
    rs_min_depth: 0.15        # 有效深度下限（米）：更近视为无效并剔除（不会产生 (0,0,0) 鬼点）
                              #   D435 有效最近距≈0.105m，再近本无数据，故该下限不产生可见裁剪
    rs_max_depth: 6.0         # 有效深度上限（米）：超出视为无效。旧值 2.0 会裁掉工作范围外的场景，
                              #   与 viewer 画面差异明显；D435 可靠量程 ~3m，6m 之外点噪声大，不建议再放宽
    rs_decimation: false      # SDK 抽稀滤波（降分辨率采样；与 rs_point_stride 作用重叠，一般只用其一）
    rs_spatial_filter: true   # 空间滤波（SDK 深度平滑，抑制边缘/远距飞点）
                              #   ★ 实测收益：累积地图的"噪声沉淀"速率 199 → 139 点/帧（-30%），
                              #   且不增加处理耗时（零开销）。它平滑深度值、不删像素，
                              #   故单帧点数不变 —— 别用点数判断它是否生效。
                              #   注：要"贴合 realsense-viewer"，应优先开 SDK 侧这三项滤波（viewer 的
                              #   Post-Processing 面板同一套算法），而不是 PCL 侧的 voxel/statistical
    rs_temporal_filter: false # 时间滤波（静止场景降噪；运动时会有拖影）
                              #   ⚠️ 本场景相机随机械臂运动：temporal 靠多帧加权平均，运动时必然
                              #   产生拖影，收益有限而副作用明显，故保持关闭

    # ── 离线回放参数（source=replay）──
    # PCD 内容视为【相机光学系】点云，需位姿 + 标定矩阵（与 input_pcd 的 base_link 语义不同）
    replay_path: ""                                # PCD 文件，或目录（目录内 *.pcd 按字典序循环）
    replay_fps: 5.0                                # 回放频率（Hz）
    replay_loop: true                              # 循环回放
    replay_frame_id: "camera_optical_frame"

    # ── 建图模式 ──
    # none        不建图：/preprocessed_cloud 与 /sensor/pointcloud 直接发当前帧（每帧全量替换，
    #             适合只关心最新一帧的前端；副作用：planning 退化为单视角，无累积地图）
    # rolling     累积建图 + 超点数上限触发体素降采样（内存有界；长时间运行的默认选择）
    # accumulate  只累积不降采样（点云最全，内存与发布耗时会随运行时间持续增长）
    # 效果对照 realsense-viewer：直接看 /perception/frame —— 任何模式下它都是"当前帧"（单视角，
    # 与 viewer 画面可逐像素对照）；若要连 /preprocessed_cloud、/sensor/pointcloud 也变成当前帧，
    # 把这里临时改成 "none"（planning 会退化为单视角，对比完记得改回 rolling）。
    # 另注：rolling 触发点数上限时地图仍会按 voxel_leaf_size 降采样，与 enable_voxel_filter 无关。
    mapping_mode: "rolling"

    # ── 前端通路语义：/sensor/pointcloud 到底发什么 ──
    # map   与 /preprocessed_cloud 同源（rolling/accumulate → 地图快照；none → 当前帧）
    # frame 恒发当前单帧 —— 前端看到的等价于 realsense-viewer 画面：单视角、无多帧累积
    #       重影、无深度噪声在体素里的永久沉淀；而 /preprocessed_cloud（planning 输入）
    #       仍按 mapping_mode 走地图，两者互不影响（这是把"前端"与"planning"解耦的开关）。
    # ★ 为什么默认 frame（实测定量）：
    #   rolling 地图是"纯追加 + 无淘汰"（map_manager 仅在超点数上限或发布前才做 5mm 体素
    #   降采样），相机静止时深度噪声也会每帧新增约 200 个落入新体素的点，且永不消失 ——
    #   实测沉淀速率 199 点/帧 ≈ 1194 点/秒，几分钟后地图被噪声填满，视觉上就是
    #   "一大堆散乱点"；而单帧模式下点数恒定（实测 22.6 万，连续 52 帧零增长）。
    #   需要在前端看"建图累积效果"时，再临时改成 "map"。
    sensor_scope: "frame"

    # ── 时间对齐 / 调度参数 ──
    # 点云用采集时刻（RealSense 直连 = node->now()；话题源 = header.stamp），
    # 位姿用 RobotState.timestamp，处理时按点云采集时刻对位姿队列插值。
    max_allowed_diff_sec: 0.05       # 点云与位姿最大允许时间差（秒），超差丢帧
    max_pose_cache: 256              # 位姿缓存最大帧数（driver 125Hz → ~2s）
    process_period: 0.1              # 处理周期（秒）：对齐→变换→滤波→入图；0.1s = 10Hz
    allow_stale_pose: false          # 位姿对齐失败时：true=降级用最近位姿继续处理；false=丢弃本帧（防错位数据）
    map_publish_period: 2.0          # 地图快照发布周期（秒）：仅 rolling/accumulate 生效（planning 仅在 pre_scan_done 取一次）

    # ── 地图参数 ──
    map_max_points: 500000           # 地图点数上限（仅 rolling 生效；超过自动体素降采样；0 = 不限）

    # ── 离线点云加载（base_link 系场景，非相机帧；联调用）──
    input_pcd: ""                    # 启动即加载的 PCD（空 = 不加载）；例："/tmp/test_cloud.pcd"
    pcd_dir: ""                      # load_cloud 按索引加载的 PCD 目录（空 = 仅 input_pcd_）

    # ── 滤波参数（PCL 侧；SDK 侧见上面的 rs_*_filter）──
    # ★ 当前策略：SDK 侧 rs_spatial_filter 已开（降噪主力，零开销）；PCL 侧三段仍全关 ——
    #   此时链路只做 nan_remove（无效深度剔除，无观感副作用）。PCL 侧每开一段都会叠加
    #   CPU 开销，且都不是"贴近 viewer"的必需项：
    #   ① enable_voxel_filter（只变稀、几乎不改观感，但直接决定 /sensor 带宽）
    #   ② enable_statistical_filter（KDTree 50 近邻，高频处理开销大，仅静止场景值得开）
    #   ③ enable_passthrough_filter（须按真实作业空间重设 ROI，当前默认值会静默裁掉工件）
    enable_passthrough_filter: false # 直通滤波开关（base_link 系 z 轴 ROI 裁剪）
    enable_voxel_filter: false       # 体素降采样开关
    voxel_leaf_size: 0.005           # 体素滤波器叶子大小（米）——真机大场景建议 ≥0.004，过小会导致点量巨大、处理变慢
                                     #   0 / 负数 = 未配置（跳过）；不要用 0 当"关闭"手段，请用上面的开关
    passthrough_field: "z"           # 直通滤波字段，可选 "x" / "y" / "z"
    passthrough_limit_min: -0.5      # 直通滤波最小值（base_link 系 z；当前值是"地面 ±0.5m"的房间设定，
    passthrough_limit_max: 0.5       #   不是相机 FOV ——按真实作业空间重设，否则会静默裁掉桌面/工件高度）
    passthrough_negative: false      # 是否取反（提取范围外的点）
    enable_statistical_filter: false # 统计滤波开关（KDTree 50 近邻开销大，高频处理建议关闭；真机静止场景可开启）
    statistical_mean_k: 50           # 统计滤波邻域点数
    statistical_std_dev_mul: 1.0     # 统计滤波标准差倍数

    # ── 标定后的相机相对法兰的变换矩阵（16 元素行优先）──
    # 点云变换：T_base = T_base_flange * camera_to_flange（驱动输出法兰位姿）
    # 由旧 camera_to_end 换算：camera_to_flange = Trans(0,0,-flange_offset) * camera_to_end
    #   （z 平移 = -0.04231331 - 0.0938 = -0.13611331，旋转不变）
    # 未标定可留空（不设置该键），节点使用单位矩阵（相机与法兰重合）
    camera_to_flange: [
      -0.6890016, 0.72474778, -0.00417675, 0.09376472,
      -0.72475632, -0.68896894, 0.00707673, -0.03569825,
      0.0022512, 0.00790301, 0.99996624, -0.13611331,
      0.0, 0.0, 0.0, 1.0]


